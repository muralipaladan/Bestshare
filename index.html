<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek NSE · 5 Best + Custom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh; padding: 1.5rem 1rem;
            display: flex; justify-content: center; align-items: flex-start;
            color: #e8f0fe;
        }
        .card {
            max-width: 800px; width: 100%;
            background: rgba(22, 40, 62, 0.85);
            backdrop-filter: blur(8px); border-radius: 2rem; padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        h1 { font-size: 1.8rem; font-weight: 600; display: flex; align-items: center; gap: 0.6rem; justify-content: center; margin-bottom: 0.5rem;}
        h1 i { color: #f6b83e; }
        .subhead { font-size: 0.9rem; opacity: 0.8; text-align: center; margin-bottom: 1.5rem; }
        
        .custom-input-group {
            background: #102433; padding: 1rem; border-radius: 1.5rem;
            border: 1px solid #2f4b6b; display: flex; flex-direction: column; gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .custom-input-group label { font-size: 0.9rem; font-weight: 500; color: #f6b83e; }
        .input-row { display: flex; gap: 0.5rem; }
        input[type="text"] {
            flex-grow: 1; padding: 0.8rem 1.2rem; border-radius: 30px;
            border: 1px solid #4b6a8a; background: #0b1a2e; color: white;
            font-size: 1rem; text-transform: uppercase;
        }
        input[type="text"]:focus { outline: none; border-color: #f6b83e; }
        
        .btn {
            background: #f6b83e; border: none; padding: 0.8rem 1.5rem; border-radius: 30px;
            font-weight: bold; color: #0b1a2e; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn:active { transform: scale(0.95); }
        .btn-full { width: 100%; font-size: 1.1rem; padding: 1rem; border-radius: 40px; margin-top: 0.5rem;}
        
        .stock-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .stock-card {
            background: rgba(12, 27, 45, 0.8); border-radius: 1.2rem; padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05); position: relative;
        }
        .stock-card h3 { font-size: 1.3rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .sector-tag { font-size: 0.7rem; background: #1f3b57; padding: 0.2rem 0.8rem; border-radius: 30px; color: #b6d0e8; }
        
        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
            background: rgba(0,0,0,0.2); padding: 0.8rem; border-radius: 1rem; margin: 0.8rem 0; font-size: 0.85rem;
        }
        .metrics-grid .val { color: #f6b83e; font-weight: bold; float: right; }
        
        .trade-box {
            background: #0b1f32; padding: 1rem; border-radius: 1rem;
            border: 1px solid #2f4b6b; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem;
        }
        .ltp-banner { background: #1a2f44; padding: 0.5rem; border-radius: 30px; text-align: center; font-weight: bold; font-size: 1.1rem; border: 1px solid #f6b83e55;}
        .trade-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem; }
        .trade-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .buy { color: #8bc34a; } .target { color: #ffd54f; } .sell { color: #ef9a9a; }
        .status-text { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #8bc34a; }
    </style>
</head>
<body>

<div class="card">
    <h1><i class="fas fa-bolt"></i> Fast Screener</h1>
    <div class="subhead">മികച്ച 5 ഓഹരികൾ + നിങ്ങളുടെ ചോയ്സ് (No CORS Delay)</div>

    <div class="custom-input-group">
        <label><i class="fas fa-search"></i> നിങ്ങൾക്ക് താല്പര്യമുള്ള ഒരു ഷെയർ ചേർക്കുക (ഓപ്ഷണൽ):</label>
        <div class="input-row">
            <input type="text" id="customStockInput" placeholder="ഉദാ: SBIN, FEDERALBNK">
        </div>
        <button class="btn btn-full" id="scanBtn"><i class="fas fa-sync-alt"></i> സ്കാൻ ആരംഭിക്കുക</button>
    </div>

    <div id="statusMsg" class="status-text"></div>
    <div class="stock-grid" id="stockGrid"></div>
</div>

<script>
    (function() {
        "use strict";

        // Only Top 5 selected stocks based on robust sectors
        const BASE_UNIVERSE = [
            { symbol: "RELIANCE", name: "Reliance Ind.", sector: "Energy" },
            { symbol: "HDFCBANK", name: "HDFC Bank", sector: "Banking" },
            { symbol: "INFY", name: "Infosys", sector: "IT" },
            { symbol: "ITC", name: "ITC Limited", sector: "FMCG" },
            { symbol: "TATAMOTORS", name: "Tata Motors", sector: "Auto" }
        ];

        const CORS_PROXIES = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];

        async function fetchWithProxyFallback(targetUrl) {
            let lastErr;
            for (const buildProxyUrl of CORS_PROXIES) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    const res = await fetch(buildProxyUrl(targetUrl), { cache: 'no-store', signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                } catch (err) { lastErr = err; }
            }
            throw lastErr || new Error('Proxy Failed');
        }

        async function fetchStockData(candidate) {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(candidate.symbol)}.NS?interval=1d&range=1d`;
            try {
                const data = await fetchWithProxyFallback(url);
                const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
                if (!price) throw new Error('No price');
                return { ...candidate, price: price, success: true };
            } catch(e) {
                return { ...candidate, price: 0, success: false };
            }
        }

        function fmtINR(n) { return n ? '₹ ' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '—'; }

        async function runScreener() {
            const btn = document.getElementById('scanBtn');
            const grid = document.getElementById('stockGrid');
            const status = document.getElementById('statusMsg');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ലോഡ് ചെയ്യുന്നു...';
            btn.disabled = true;
            grid.innerHTML = '';
            status.innerHTML = '';

            let candidates = [...BASE_UNIVERSE];
            const customSym = document.getElementById('customStockInput').value.trim().toUpperCase();
            if(customSym) {
                candidates.push({ symbol: customSym, name: "നിങ്ങളുടെ ചോയ്സ്", sector: "Custom" });
            }

            const promises = candidates.map(c => fetchStockData(c));
            const results = await Promise.all(promises);

            let html = '';
            results.forEach(s => {
                if(!s.success) {
                    html += `<div class="stock-card" style="border-color:#ef9a9a;"><h3 style="color:#ef9a9a;">${s.symbol} - ഡാറ്റ ലഭ്യമല്ല</h3></div>`;
                    return;
                }
                
                const entry = s.price * 0.985;
                const target = s.price * 1.08;
                const sl = s.price * 0.94;

                html += `
                    <div class="stock-card">
                        <h3><span>${s.symbol}</span> <span class="sector-tag">${s.sector}</span></h3>
                        <div style="font-size: 0.8rem; opacity: 0.8; margin-bottom: 1rem;">${s.name}</div>
                        
                        <div class="trade-box">
                            <div class="ltp-banner">LTP: ${fmtINR(s.price)}</div>
                            <div class="trade-row buy"><span><i class="fas fa-arrow-right"></i> Entry Range:</span> <strong>${fmtINR(entry)} - ${fmtINR(s.price)}</strong></div>
                            <div class="trade-row target"><span><i class="fas fa-flag-checkered"></i> Target:</span> <strong>${fmtINR(target)}</strong></div>
                            <div class="trade-row sell"><span><i class="fas fa-stop-circle"></i> Stop Loss:</span> <strong>${fmtINR(sl)}</strong></div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> സ്കാൻ ആരംഭിക്കുക';
            btn.disabled = false;
            
            const timeStr = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            status.innerHTML = `<i class="fas fa-check-circle"></i> അവസാനം അപ്ഡേറ്റ് ചെയ്തത്: ${timeStr}`;
        }

        document.getElementById('scanBtn').addEventListener('click', runScreener);
        
        // Auto-run on load
        runScreener();
    })();
</script>
</body>
</html>
