<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NSE Live Screener · Yahoo Finance</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
  font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  min-height: 100vh; padding: 1.5rem 1rem;
  display: flex; justify-content: center; align-items: flex-start;
  color: #e8f0fe;
}
.card {
  max-width: 800px; width: 100%;
  background: rgba(22, 40, 62, 0.85);
  backdrop-filter: blur(8px); border-radius: 2rem; padding: 1.5rem;
  border: 1px solid rgba(255, 255, 255, 0.04);
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
h1 { font-size: 1.8rem; font-weight: 600; display: flex; align-items: center; gap: 0.6rem; justify-content: center; margin-bottom: 0.3rem;}
h1 i { color: #f6b83e; }
.subhead { font-size: 0.85rem; opacity: 0.75; text-align: center; margin-bottom: 1.2rem; }
.live-badge { font-size: 0.72rem; background: #1b3450; padding: 0.35rem 0.9rem; border-radius: 30px; border: 1px solid #4caf5055; color: #4caf50; display:inline-flex; align-items:center; gap:0.4rem; margin: 0 auto 1.2rem; }
.badge-row { display:flex; justify-content:center; }

.btn {
  background: #f6b83e; border: none; padding: 0.8rem 1.5rem; border-radius: 30px;
  font-weight: bold; color: #0b1a2e; cursor: pointer; transition: 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; font-size: 1.05rem;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn:active { transform: scale(0.95); }

.search-section { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
.search-section input { flex: 1; padding: 0.8rem 1.2rem; border-radius: 30px; border: 1px solid #4b6a8a; background: #0b1a2e; color: white; font-size: 1rem; text-transform: uppercase; }
.search-section input:focus { outline: none; border-color: #f6b83e; }
.search-section button { width: auto; font-size: 1rem; padding: 0.8rem 1.3rem; }

.highlight-banner {
  background: linear-gradient(45deg, #1f3b57, #1a2f44);
  border-left: 4px solid #f6b83e;
  padding: 1.1rem;
  border-radius: 10px;
  margin-bottom: 1.2rem;
}
.highlight-banner h4 { color: #f6b83e; margin-bottom: 0.4rem; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; }

.stock-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.2rem; }
.stock-card {
  background: rgba(12, 27, 45, 0.8); border-radius: 1.2rem; padding: 1.2rem;
  border: 1px solid rgba(255, 255, 255, 0.05); position: relative;
  animation: fadeIn 0.4s ease-in-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.stock-card h3 { font-size: 1.25rem; margin-bottom: 0.3rem; display: flex; justify-content: space-between; align-items:center; }
.sector-tag { font-size: 0.7rem; background: #1f3b57; padding: 0.2rem 0.7rem; border-radius: 30px; color: #b6d0e8; }
.change-tag { font-size: 0.85rem; font-weight: bold; padding: 0.15rem 0.6rem; border-radius: 30px; }
.pos { background:#1b3a1b; color:#8bc34a; } .neg { background:#3a1b1b; color:#ef9a9a; }
.trade-box {
  background: #0b1f32; padding: 1rem; border-radius: 1rem;
  border: 1px solid #2f4b6b; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem;
}
.ltp-banner { background: #1a2f44; padding: 0.5rem; border-radius: 30px; text-align: center; font-weight: bold; font-size: 1.1rem; border: 1px solid #f6b83e55;}
.trade-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem; }
.trade-row:last-child { border-bottom: none; padding-bottom: 0; }
.buy { color: #8bc34a; } .target { color: #ffd54f; } .sell { color: #ef9a9a; }
.meta-row { display:flex; gap:0.8rem; font-size:0.75rem; opacity:0.7; margin-top:0.4rem; flex-wrap: wrap; }
.status-text { text-align: center; margin-top: 1rem; font-size: 0.88rem; color: #8bc34a; }
.error-text { text-align: center; margin-top: 0.6rem; font-size: 0.85rem; color: #ef9a9a; background: rgba(239, 154, 154, 0.1); padding: 10px; border-radius: 8px;}
.proxy-note { text-align:center; font-size:0.7rem; opacity:0.5; margin-top: 0.3rem; }
</style>
</head>
<body>

<div class="card">
<h1><i class="fas fa-chart-pie"></i> NSE Live Screener</h1>
<div class="subhead">Yahoo Finance ലൈവ് ഡാറ്റ അടിസ്ഥാനമാക്കി — API Key ആവശ്യമില്ല</div>
<div class="badge-row"><span class="live-badge"><i class="fas fa-circle" style="font-size:0.5rem;"></i> LIVE DATA · CORS PROXY CHAIN</span></div>

<div class="search-section">
<input type="text" id="singleStockInput" placeholder="ഷെയറിന്റെ പേര് (ഉദാ: HCLTECH, RELIANCE)">
<button class="btn" id="singleStockBtn"><i class="fas fa-search"></i> Search</button>
</div>
<div id="singleStockResult"></div>

<div id="highestDepthBanner" class="highlight-banner" style="display:none;"></div>

<div class="subhead" style="margin-top:0.5rem;">5 പ്രധാന സെക്ടറുകളിലെ ഓരോന്നിന്റെയും ടോപ്പ് ഷെയർ — ലൈവ് ഡാറ്റ (വേഗത്തിൽ)</div>
<button class="btn" id="scanBtn"><i class="fas fa-search-dollar"></i> Find Day Best 5</button>
<div id="statusMsg" class="status-text"></div>
<div class="stock-grid" id="stockGrid"></div>
<div class="proxy-note" id="proxyNote"></div>
</div>

<script>
(function() {
"use strict";

// -------------------------------------------------------------
// CORS proxy fallback chain (no API key needed — Yahoo Finance chart endpoint)
// -------------------------------------------------------------
const PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  (url) => `https://thingproxy.freeboard.io/fetch/${url}`
];

async function fetchViaProxies(targetUrl, statusEl) {
  let lastErr = null;
  for (let i = 0; i < PROXIES.length; i++) {
    const proxied = PROXIES[i](targetUrl);
    try {
      const res = await fetch(proxied, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const data = JSON.parse(text);
      return data;
    } catch (e) {
      lastErr = e;
      continue; // try next proxy
    }
  }
  throw lastErr || new Error("All proxies failed");
}

// 5 sectors — one most-liquid/top pick per sector, so only 5 fetches are needed (fast)
const CANDIDATE_UNIVERSE = [
  { symbol: "RELIANCE", name: "Reliance Industries", sector: "Energy" },
  { symbol: "HDFCBANK", name: "HDFC Bank", sector: "Banking" },
  { symbol: "TCS", name: "Tata Consultancy Services", sector: "IT" },
  { symbol: "MARUTI", name: "Maruti Suzuki", sector: "Auto" },
  { symbol: "TATASTEEL", name: "Tata Steel", sector: "Metals" }
];

function fmtINR(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '₹ ' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// -------------------------------------------------------------
// Fetch real live quote for one NSE symbol via Yahoo Finance v8 chart endpoint
// -------------------------------------------------------------
async function fetchLiveQuote(symbol) {
  const yahooSymbol = encodeURIComponent(symbol + ".NS");
  const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${yahooSymbol}?interval=1d&range=1d`;

  try {
    const data = await fetchViaProxies(targetUrl);
    const result = data && data.chart && data.chart.result && data.chart.result[0];
    if (!result || !result.meta) throw new Error("NotFound");

    const meta = result.meta;
    const ltp = meta.regularMarketPrice;
    const prevClose = meta.previousClose || meta.chartPreviousClose;
    if (!ltp) throw new Error("NotFound");

    const changePct = prevClose ? ((ltp - prevClose) / prevClose) * 100 : 0;

    // volume: sum of the day's volume series if available, else regularMarketVolume-like field
    let volume = 0;
    try {
      const vols = result.indicators.quote[0].volume || [];
      volume = vols.reduce((a, b) => a + (b || 0), 0);
    } catch (e) { volume = 0; }

    return {
      ok: true,
      ltp: ltp,
      prevClose: prevClose,
      changePct: changePct,
      volume: volume,
      dayHigh: meta.regularMarketDayHigh,
      dayLow: meta.regularMarketDayLow,
      currency: meta.currency || "INR",
      exchangeTime: meta.regularMarketTime ? new Date(meta.regularMarketTime * 1000) : null
    };
  } catch (e) {
    return { ok: false, error: e.message === "NotFound" ? "NotFound" : "FetchFailed" };
  }
}

function generateTradeCard(symbol, name, sector, q, isSearchResult) {
  const ltp = q.ltp;
  const entryMin = (ltp * 0.995).toFixed(2);
  const entryMax = ltp.toFixed(2);
  const target = (ltp * 1.025).toFixed(2);
  const sl = (ltp * 0.985).toFixed(2);

  const changeCls = q.changePct >= 0 ? 'pos' : 'neg';
  const changeSign = q.changePct >= 0 ? '+' : '';
  const highlightStyle = isSearchResult ? 'style="margin-bottom: 1.5rem; border: 1px solid #f6b83e;"' : '';

  const timeStr = q.exchangeTime ? q.exchangeTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '—';

  return `
  <div class="stock-card" ${highlightStyle}>
    <h3>
      <span>${symbol}</span>
      <span style="display:flex; gap:0.5rem; align-items:center;">
        <span class="change-tag ${changeCls}">${changeSign}${q.changePct.toFixed(2)}%</span>
        <span class="sector-tag">${sector}</span>
      </span>
    </h3>
    <div style="font-size: 0.8rem; opacity: 0.8; margin-bottom: 0.8rem;">${name}</div>
    <div class="trade-box">
      <div class="ltp-banner">LTP: ${fmtINR(ltp)}</div>
      <div class="trade-row buy"><span><i class="fas fa-arrow-right"></i> Entry Range:</span> <strong>₹ ${entryMin} - ₹ ${entryMax}</strong></div>
      <div class="trade-row target"><span><i class="fas fa-flag-checkered"></i> Target:</span> <strong>₹ ${target}</strong></div>
      <div class="trade-row sell"><span><i class="fas fa-stop-circle"></i> Stop Loss:</span> <strong>₹ ${sl}</strong></div>
    </div>
    <div class="meta-row">
      <span>Prev Close: ${fmtINR(q.prevClose)}</span>
      <span>Day High: ${fmtINR(q.dayHigh)}</span>
      <span>Day Low: ${fmtINR(q.dayLow)}</span>
      <span>Updated: ${timeStr}</span>
    </div>
  </div>
  `;
}

// -------------------------------------------------------------
// Single Stock Search
// -------------------------------------------------------------
document.getElementById('singleStockBtn').addEventListener('click', async () => {
  const inputVal = document.getElementById('singleStockInput').value.trim().toUpperCase();
  const resultDiv = document.getElementById('singleStockResult');

  if (!inputVal) {
    alert('ദയവായി ഒരു ഷെയറിന്റെ പേര് നൽകുക!');
    return;
  }

  resultDiv.innerHTML = '<div style="text-align:center; padding: 1rem;"><i class="fas fa-spinner fa-spin"></i> ലൈവ് ഡാറ്റ എടുക്കുന്നു...</div>';

  const q = await fetchLiveQuote(inputVal);

  if (q.ok) {
    resultDiv.innerHTML = generateTradeCard(inputVal, "Searched Stock", "Search Result", q, true);
  } else if (q.error === "NotFound") {
    resultDiv.innerHTML = '<div class="error-text"><i class="fas fa-exclamation-triangle"></i> ഷെയർ കണ്ടെത്തിയില്ല! ശരിയായ NSE symbol ആണോ എന്ന് പരിശോധിക്കുക (ഉദാ: HDFCBANK, RELIANCE).</div>';
  } else {
    resultDiv.innerHTML = '<div class="error-text"><i class="fas fa-exclamation-triangle"></i> എല്ലാ പ്രോക്സികളും പരാജയപ്പെട്ടു. കുറച്ചു കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക അല്ലെങ്കിൽ VPN/network പരിശോധിക്കുക.</div>';
  }
});

// -------------------------------------------------------------
// Day Best 5 Screener — real ranking by |day % change| and volume, sequential fetch
// -------------------------------------------------------------
async function runScreener() {
  const btn = document.getElementById('scanBtn');
  const grid = document.getElementById('stockGrid');
  const status = document.getElementById('statusMsg');
  const depthBanner = document.getElementById('highestDepthBanner');

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ഡാറ്റ എടുക്കുന്നു...';
  btn.disabled = true;
  grid.innerHTML = '';
  status.innerHTML = '';
  depthBanner.style.display = 'none';

  const results = [];

  for (let i = 0; i < CANDIDATE_UNIVERSE.length; i++) {
    const s = CANDIDATE_UNIVERSE[i];
    status.innerHTML = `ലോഡ് ചെയ്യുന്നു: ${s.symbol} (${i + 1}/${CANDIDATE_UNIVERSE.length})...`;

    const q = await fetchLiveQuote(s.symbol);
    if (q.ok) {
      results.push({ ...s, q });
    }
    // small stagger to be gentle on the free proxies
    await new Promise(resolve => setTimeout(resolve, 300));
  }

  if (results.length === 0) {
    status.innerHTML = '';
    grid.innerHTML = '<div class="error-text"><i class="fas fa-exclamation-triangle"></i> ലൈവ് ഡാറ്റ ഒന്നും ലഭിച്ചില്ല. പ്രോക്സികൾ താൽക്കാലികമായി ബ്ലോക്ക് ആയിരിക്കാം — കുറച്ചു കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.</div>';
    btn.innerHTML = '<i class="fas fa-search-dollar"></i> Find Day Best 5';
    btn.disabled = false;
    return;
  }

  // Rank by absolute day % change (real momentum), take top 5
  results.sort((a, b) => Math.abs(b.q.changePct) - Math.abs(a.q.changePct));
  const top5 = results.slice(0, 5);

  let html = '';
  top5.forEach(r => {
    html += generateTradeCard(r.symbol, r.name, r.sector, r.q, false);
  });
  grid.innerHTML = html;

  // Highest volume among fetched results (real data, not random)
  const topVolumeStock = results.reduce((max, r) => (r.q.volume > (max.q.volume || 0) ? r : max), results[0]);
  depthBanner.style.display = 'block';
  depthBanner.innerHTML = `
    <h4><i class="fas fa-water"></i> Highest Volume (Most Active)</h4>
    <p style="font-size: 1.05rem; margin-top: 0.4rem;">
      <strong>Stock:</strong> <span style="color:#fff;">${topVolumeStock.symbol}</span> |
      <strong>Sector:</strong> <span style="color:#fff;">${topVolumeStock.sector}</span> |
      <strong>Volume:</strong> <span style="color:#fff;">${topVolumeStock.q.volume.toLocaleString('en-IN')}</span>
    </p>
    <p style="font-size: 0.82rem; opacity:0.8; margin-top:0.4rem;">ഇന്ന് ഏറ്റവും കൂടുതൽ ട്രേഡിംഗ് വോളിയം രേഖപ്പെടുത്തിയ ഷെയർ (real-time).</p>
  `;

  const timeStr = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  status.innerHTML = `<i class="fas fa-check-circle"></i> ലൈവ് അപ്ഡേറ്റ് പൂർത്തിയായി: ${timeStr} (${results.length}/${CANDIDATE_UNIVERSE.length} ഷെയറുകൾ ലഭിച്ചു)`;

  btn.innerHTML = '<i class="fas fa-search-dollar"></i> Find Day Best 5';
  btn.disabled = false;
}

document.getElementById('scanBtn').addEventListener('click', runScreener);

document.getElementById('proxyNote').innerHTML = 'Data source: Yahoo Finance (query1.finance.yahoo.com) via CORS proxy chain — allorigins → codetabs → corsproxy.io → thingproxy';
})();
</script>
</body>
</html>
